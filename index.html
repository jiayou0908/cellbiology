let userAnswers = {};
let currentFilter = 'all';
let comboCount = 0;
let allExpanded = false;

function renderQuiz() {
  const listEl = document.getElementById('quiz-list');
  listEl.innerHTML = '';

  const filtered = questionsData.filter(q => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'wrong') {
      return userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.answer;
    }
    return q.cat === currentFilter;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-msg">🎉 目前此分類沒有題目（或您還沒有答錯任何題目）！</div>`;
    return;
  }

  const labels = ['A', 'B', 'C', 'D'];

  filtered.forEach(q => {
    const answered = userAnswers[q.id] !== undefined;
    const userChoice = userAnswers[q.id];
    const isCorrect = userChoice === q.answer;

    const card = document.createElement('div');
    card.className = 'q-card';

    let statusHtml = '';
    if (answered) {
      statusHtml = isCorrect
        ? `<span class="q-status" style="color:var(--success)">✅ Correct!</span>`
        : `<span class="q-status" style="color:var(--danger)">❌ Wrong（正確答案：${labels[q.answer]}）</span>`;
    } else {
      statusHtml = `<span class="q-status" style="color:#94a3b8">尚未作答</span>`;
    }

    let optionsHtml = q.options.map((optText, idx) => {
      let btnClass = 'opt-btn';
      if (answered) {
        if (idx === q.answer) btnClass += ' correct';
        else if (idx === userChoice && userChoice !== q.answer) btnClass += ' wrong';
      }
      return `
        <button class="${btnClass}" ${answered ? 'disabled' : ''} onclick="selectOption(${q.id}, ${idx})">
          <span class="opt-label">${labels[idx]}</span>
          <span>${optText}</span>
        </button>
      `;
    }).join('');

    let optExpsHtml = q.optExps.map((expText, idx) => {
      const isRightOpt = idx === q.answer;
      const itemClass = isRightOpt ? 'opt-exp-item is-correct-opt' : 'opt-exp-item is-wrong-opt';
      const tagClass = isRightOpt ? 'opt-tag tag-correct' : 'opt-tag tag-wrong';
      const tagLabel = isRightOpt ? `(${labels[idx]}) 正確選項` : `(${labels[idx]}) 誘答選項解析`;
      return `
        <div class="${itemClass}">
          <span class="${tagClass}">${tagLabel}</span>
          <span>${expText}</span>
        </div>
      `;
    }).join('');

    const showExpClass = (answered || allExpanded) ? 'exp-box show' : 'exp-box';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-badge">${q.code}</span>
        ${statusHtml}
      </div>
      <div class="q-title">${q.question}</div>
      <div class="options-list">
        ${optionsHtml}
      </div>
      <div class="${showExpClass}">
        <div class="exp-header">💡 答案與四個選項完整解析（正確答案：${labels[q.answer]}）</div>
        <div class="stem-analysis">
          ${q.stemExp}
        </div>
        <div class="opt-exp-title">🔍 各選項生物學概念與對錯原因：</div>
        <div class="opt-exp-list">
          ${optExpsHtml}
        </div>
      </div>
    `;

    listEl.appendChild(card);
  });
}

function selectOption(qId, optIdx) {
  if (userAnswers[qId] !== undefined) return;
  userAnswers[qId] = optIdx;

  const q = questionsData.find(item => item.id === qId);
  if (optIdx === q.answer) {
    comboCount++;
  } else {
    comboCount = 0;
  }

  updateScoreboard();
  renderQuiz();
}

function updateScoreboard() {
  const total = questionsData.length;
  const answeredKeys = Object.keys(userAnswers);
  const answeredCount = answeredKeys.length;
  let correctCount = 0;

  answeredKeys.forEach(k => {
    const qId = parseInt(k);
    const q = questionsData.find(item => item.id === qId);
    if (userAnswers[qId] === q.answer) correctCount++;
  });

  const score = Math.round((correctCount / total) * 100);
  const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
  const progressPercent = Math.round((answeredCount / total) * 100);

  document.getElementById('stat-progress').textContent = `已答：${answeredCount} / ${total}`;
  document.getElementById('stat-score').textContent = `得分：${score} 分`;
  document.getElementById('stat-accuracy').textContent = `正確率：${accuracy}%`;
  document.getElementById('stat-combo').textContent = `🔥 連對：${comboCount}`;
  document.getElementById('progress-bar').style.width = `${progressPercent}%`;
}

function setFilter(filterKey, e) {
  currentFilter = filterKey;
  const buttons = document.querySelectorAll('#filter-tabs .tab-btn');
  buttons.forEach(btn => btn.classList.remove('active'));
  if (e && e.target) e.target.classList.add('active');
  renderQuiz();
}

function toggleAllExplanations() {
  allExpanded = !allExpanded;
  renderQuiz();
}

function resetGame() {
  if (!confirm('確定要清空所有作答紀錄並重新開始嗎？')) return;
  userAnswers = {};
  comboCount = 0;
  allExpanded = false;
  updateScoreboard();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
updateScoreboard();
</script>
